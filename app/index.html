<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小说影坊 · 本地版</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e7e8ed;background:#101218}*{box-sizing:border-box}body{margin:0}main{max-width:1160px;margin:auto;padding:36px 26px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}h1{font-size:28px;margin:0}h2{font-size:19px}p{line-height:1.7;color:#aeb4c5}.badge{color:#a0dabd;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.card{padding:24px;background:#1b1f29;border:1px solid #303643;border-radius:16px;margin-bottom:20px}label{display:block;margin:16px 0 8px;color:#bbc2d4}input,textarea,select{width:100%;padding:12px;background:#11151d;color:#eee;border:1px solid #424957;border-radius:8px;font:inherit}textarea{min-height:290px;resize:vertical;line-height:1.6}button,.link{display:inline-block;background:#bcd2ff;color:#14213b;border:0;border-radius:9px;padding:12px 17px;cursor:pointer;font:inherit;text-decoration:none;margin:10px 6px 0 0}button:disabled{opacity:.45;cursor:wait}button.secondary{background:#353d4c;color:#e7e8ed}.status{font-size:14px;white-space:pre-wrap;line-height:1.8}.muted{font-size:13px;color:#aeb4c5}.job{border-top:1px solid #38404e;padding:16px 0}.job h3{margin:0 0 8px;font-size:16px}.message{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;color:#b6c5e0}video{width:100%;max-height:480px;border-radius:8px;background:black}#error{color:#ffc9bf;white-space:pre-wrap}#editor{min-height:420px;font-size:13px}input[type=checkbox]{width:auto}details{margin-top:15px}a{color:#bcd2ff}@media(max-width:800px){.grid{grid-template-columns:1fr}main{padding:20px}header{display:block}}
</style>
<main><header><div><h1>小说影坊</h1><p>把文字变成画面，在自己的电脑上完成。</p></div><span class="badge">LOCAL STUDIO / 本地运行</span></header>
<div class="card"><strong>运行环境</strong><div id="health" class="status">正在检查…</div></div>
<div class="grid"><section><div class="card"><h2>创建章节视频</h2><label>章节名称</label><input id="title" placeholder="例如：赤壁之战"><label>章节正文</label><textarea id="text" placeholder="直接粘贴正文，或选择本地 TXT / MD 文件。分镜只依据你提供的内容。"></textarea><input type="file" id="file" accept=".txt,.md"><label>视频时长</label><select id="duration"><option value="10">10 秒 · 先试片</option><option value="30" selected>30 秒</option><option value="60">60 秒</option><option value="90">90 秒</option></select><label><input type="checkbox" id="automatic"> 分镜完成后自动生成视频</label><p class="muted">默认先给你检查分镜。无配音。装好视频模型后，每镜直接生成约 2 到 5 秒的连续写实画面，只播放一次。成片仍短于所选秒数，清晰度和时长低于即梦。角色一致性需要人工检查。短文按画面转折拆镜。</p><button id="create">开始制作</button><div id="error"></div></div></section>
<section><div class="card"><h2>我的作品</h2><p class="muted">关掉页面不会停止运行。再次打开可查看结果；失败后保留已经完成的镜头。</p><div id="jobs">暂时没有作品</div></div></section></div>
<div class="card" id="editbox" hidden><h2>检查分镜</h2><p>prompt 是中文分镜指导，视频模型直接读这一段。narration 只是这一镜对应的原文，不会念出来。image_prompt 只在退回插画动画时使用。</p><textarea id="editor" spellcheck="false"></textarea><button id="render">保存并生成视频</button><button class="secondary" onclick="document.getElementById('editbox').hidden=true">收起</button></div>
</main><script>
const token='__TOKEN__';let selected=null,lastJobs='';const $=id=>document.getElementById(id);
async function post(path,data){const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json','X-Studio-Token':token},body:JSON.stringify(data)});const b=await r.json();if(!r.ok)throw Error(b.error);return b}
function el(tag,text,cls){const e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}
async function refresh(){try{const jobs=await(await fetch('/api/jobs')).json();const key=JSON.stringify(jobs);if(key===lastJobs)return;lastJobs=key;$('jobs').replaceChildren();if(!jobs.length)$('jobs').append(el('p','暂时没有作品'));for(const j of jobs){const div=el('div','','job');div.append(el('h3',j.title),el('div',j.message,'message'));if(j.video){const v=document.createElement('video');v.controls=true;v.preload='metadata';v.src=j.video;div.append(v);const a=el('a','下载 MP4','link');a.href=j.video;a.download=j.title+'.mp4';div.append(a)}if(j.plan && ['review','paused','error','done'].includes(j.status)){const b=el('button','查看分镜 / 继续生成','secondary');b.onclick=()=>{selected=j.id;$('editor').value=JSON.stringify(j.plan,null,2);$('editbox').hidden=false;$('editbox').scrollIntoView({behavior:'smooth'})};div.append(b)}if(!j.plan && ['new','paused','error'].includes(j.status)){const b=el('button','重新编写分镜','secondary');b.onclick=()=>post('/api/replan',{id:j.id}).catch(showError);div.append(b)}if(['planning','generating','assembling'].includes(j.status)){const b=el('button','暂停','secondary');b.onclick=()=>post('/api/pause',{id:j.id}).catch(showError);div.append(b)}$('jobs').append(div)}}catch(e){showError(e)}}
function showError(e){$('error').textContent=e.message}
async function check(){try{const h=await(await fetch('/api/health')).json();const rows=h.engine==='wan'?[['comfy','生成服务'],['checkpoint','视频模型'],['planner','文本模型']]:[['comfy','生成服务'],['checkpoint','画面模型'],['motion','动画模型'],['planner','文本模型']];$('health').textContent=rows.map(([k,v])=>(h[k]?'✓ ':'○ ')+v).join('　');$('create').disabled=!h.ready;if(!h.ready)$('health').append(el('div','环境尚未全部就绪；安装完成后此处会自动更新。','muted'))}catch(e){$('health').textContent='本地服务未连接，请重新打开启动文件'}}
$('create').onclick=async()=>{try{$('error').textContent='';$('create').disabled=true;await post('/api/jobs',{title:$('title').value||'未命名章节',text:$('text').value,duration:Number($('duration').value),automatic:$('automatic').checked});await refresh()}catch(e){showError(e)}finally{await check()}};
$('render').onclick=async()=>{try{await post('/api/render',{id:selected,plan:JSON.parse($('editor').value)});$('editbox').hidden=true;await refresh()}catch(e){showError(e)}};
$('file').onchange=async e=>{const f=e.target.files[0];if(f){if(f.size>400000){showError(Error('文件过大，请按章节导入'));return}$('text').value=await f.text();if(!$('title').value)$('title').value=f.name.replace(/\.[^.]+$/,'')}};
check();refresh();setInterval(refresh,5000);setInterval(check,15000);
</script></html>
